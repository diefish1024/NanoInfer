[build-system]
requires = ["scikit-build-core>=0.7.0", "cmake>=3.20"]
build-backend = "scikit_build_core.build"

[project]
name = "nano_infer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "triton", "safetensors"]

[tool.scikit-build]
wheel.packages = ["nano_infer"]
cmake.minimum-version = "3.20"
